name: build-blog

on:
  push:
    branches: [main]
    paths:
      - 'blog/posts/**'
      - 'blog/_template.html'
      - 'tools/build_blog.py'
      - '.github/workflows/build-blog.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install pyyaml

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Build blog HTML
        run: python tools/build_blog.py

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          exclude_assets: |
            .github
            .gitignore
            tools
            README.md
            blog/posts
            blog/_template.html